<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Dai repository alle viste sui tre host</title><desc id="d">Il programma comune di method riceve contenuti e configurazione da ciascun repository. Linux usa servizi systemd utente; Windows usa un task pianificato.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<path d="M275 130 L410 180" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M845 130 L710 180" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M370 275 L195 330" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M560 275 L560 330" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M750 275 L925 330" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"/>
<rect x="20" y="15" width="510" height="115" rx="16" fill="#f8fafc" stroke="#4338ca" stroke-width="2"/><text x="42" y="50" fill="#4338ca" font-size="23" font-weight="700">method · il programma comune</text>
<text x="42" y="83" font-size="19" fill="#334155">o3/view/build.py → genera le pagine</text>
<text x="42" y="110" font-size="19" fill="#334155">o3/view/serve.py → le serve al browser</text>
<rect x="590" y="15" width="510" height="115" rx="16" fill="#f8fafc" stroke="#c2410c" stroke-width="2"/><text x="612" y="50" fill="#c2410c" font-size="23" font-weight="700">Ogni repository · i suoi contenuti</text>
<text x="612" y="83" font-size="19" fill="#334155">Register, collezioni e presentazione</text>
<text x="612" y="110" font-size="19" fill="#334155">o3/view/project.py → identità del progetto</text>
<rect x="240" y="180" width="640" height="95" rx="16" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="262" y="215" fill="#334155" font-size="23" font-weight="700">Pubblicazione da commit → pagine HTML</text>
<text x="262" y="248" font-size="19" fill="#334155">Una copia di method su ogni host; nessun server centrale</text>
<rect x="20" y="330" width="350" height="155" rx="16" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/><text x="42" y="365" fill="#0f766e" font-size="23" font-weight="700">deck · systemd utente</text>
<text x="42" y="398" font-size="19" fill="#334155">method :8001 · nixos :8002</text>
<text x="42" y="425" font-size="19" fill="#334155">salute :8003 · economia :8004</text>
<text x="42" y="452" font-size="19" fill="#334155">Configurati da nixos di casa</text>
<rect x="390" y="330" width="340" height="155" rx="16" fill="#f8fafc" stroke="#a16207" stroke-width="2"/><text x="412" y="365" fill="#a16207" font-size="23" font-weight="700">svezia · systemd utente</text>
<text x="412" y="398" font-size="19" fill="#334155">bi :8001 · nixos :8002</text>
<text x="412" y="425" font-size="19" fill="#334155">baserow :8003</text>
<text x="412" y="452" font-size="19" fill="#334155">Configurati da nixos di lavoro</text>
<rect x="750" y="330" width="350" height="155" rx="16" fill="#f8fafc" stroke="#7e22ce" stroke-width="2"/><text x="772" y="365" fill="#7e22ce" font-size="23" font-weight="700">danea2 · Task Scheduler</text>
<text x="772" y="398" font-size="19" fill="#334155">danea-auto :8001</text>
<text x="772" y="425" font-size="19" fill="#334155">Lanciatore Windows locale</text>
<text x="772" y="452" font-size="19" fill="#334155">Usa build.py e serve.py comuni</text>
<text x="560" y="540" text-anchor="middle" font-size="18" fill="#475569">Il browser legge le pagine sulle reti private. I progetti mantengono contenuti e responsabilità.</text></svg>
