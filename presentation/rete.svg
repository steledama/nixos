<text x="42" y="248" font-size="19" fill="#334155">Server VPN casa · client VPN lavoro</text>
<text x="42" y="275" font-size="19" fill="#334155">Viste dei progetti · cicli autonomi</text>
<text x="42" y="302" font-size="19" fill="#334155">Punto di accesso alla rete domestica</text>
<rect x="20" y="380" width="245" height="110" rx="16" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/><text x="42" y="415" fill="#0f766e" font-size="23" font-weight="700">neve</text>
<text x="42" y="448" font-size="19" fill="#334155">Desktop, media e scanner</text>
