<title id="t">La casa e i suoi accessi privati</title><desc id="d">Deck collega telefono e rete di casa tramite VPN casa; dalla casa solo deck raggiunge la rete ufficio tramite VPN lavoro. Il server svezia e la postazione di sviluppo norvegia sono configurati in un altro repository.</desc>
