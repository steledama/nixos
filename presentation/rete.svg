<text x="317" y="448" font-size="19" fill="#334155">Gaming, modelli e GPU</text>
<rect x="680" y="180" width="420" height="140" rx="16" fill="#f8fafc" stroke="#c2410c" stroke-width="2"/><text x="702" y="215" fill="#c2410c" font-size="23" font-weight="700">Ufficio · un altro repository</text>
<text x="702" y="248" font-size="19" fill="#334155">svezia: server · norvegia: sviluppo</text>
<text x="702" y="275" font-size="19" fill="#334155">Accesso dalla casa solo tramite deck</text>
<text x="702" y="302" font-size="19" fill="#334155">SSH e pagine sulle reti private</text>
<rect x="680" y="380" width="420" height="110" rx="16" fill="#f8fafc" stroke="#c2410c" stroke-width="2"/><text x="702" y="415" fill="#c2410c" font-size="23" font-weight="700">Ritorno verso casa</text>
<text x="702" y="448" font-size="19" fill="#334155">VPN casa da norvegia</text>
<text x="702" y="475" font-size="19" fill="#334155">Avvio manuale</text>
<text x="560" y="540" text-anchor="middle" font-size="18" fill="#475569">SSH usa chiavi. Le pagine non sono esposte sulla rete pubblica; i tunnel collegano le reti private.</text></svg>
